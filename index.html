<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNTZEE WARS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=VT323&family=Share+Tech+Mono&display=swap');

:root {
  --ink:#050d1a; --panel:#0a1628; --panel2:#0d1e36; --rim:#1c3050; --rim2:#2a4a70;
  --willow:#a8e6cf; --willow2:#5ec9a0; --willow-dim:#1a3d2e; --willow-glow:rgba(168,230,207,0.35);
  --fire:#ff4f1f; --fire2:#ff8c5a; --ice:#7ecfff; --thunder:#f7d84b;
  --wind:#4cff9f; --dark:#c05aff; --restore:#00ff88; --gold:#ffd700; --limit:#ff6d00;
  --txt:#c8daea; --txt2:#4a6a8a; --white:#fff;
  --hp-hi:#00e676; --hp-mid:#ffeb3b; --hp-lo:#f44336; --mp:#29b6f6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--txt);font-family:'Share Tech Mono',monospace;position:relative}

/* ── GLOBAL BG ── */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(28,48,80,0.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,48,80,0.18) 1px,transparent 1px);
  background-size:44px 44px;
}
#bg-radials{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 80%,rgba(168,230,207,0.05) 0%,transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 20%,rgba(255,79,31,0.04) 0%,transparent 60%);
}
#bg-scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
}
#bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(5,13,26,0.92) 100%)}
#particle-cv{position:absolute;inset:0}

/* ── GAME SHELL ── */
#game{position:relative;z-index:1;width:100%;max-width:980px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── HUD BAR ── */
#hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px;flex-shrink:0;
  background:linear-gradient(90deg,rgba(10,22,40,0.98),rgba(13,30,54,0.98));
  border-bottom:1px solid var(--rim);position:relative;
}
#hud::after{content:'';position:absolute;bottom:-2px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--willow2),transparent);opacity:0.6}
.hud-logo{font-family:'Orbitron',sans-serif;font-size:clamp(0.85rem,2vw,1.1rem);font-weight:900;
  letter-spacing:0.2em;color:var(--white);
  text-shadow:0 0 12px var(--willow),0 0 24px rgba(168,230,207,0.3)}
.hud-logo span{color:var(--willow)}
#hud-mid{font-family:'VT323',monospace;font-size:1rem;letter-spacing:0.25em;color:var(--willow2);text-align:center;flex:1}
.hud-wave{font-family:'Orbitron',sans-serif;font-size:0.5rem;letter-spacing:0.2em;color:var(--txt2);text-align:right;cursor:pointer}
.hud-wave b{color:var(--willow);font-size:0.65rem;display:block}

/* ── SCREENS ── */
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;animation:scIn .3s ease both}
.screen.active{display:flex}
@keyframes scIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════════════════
   TITLE SCREEN
════════════════════════════════════ */
#sc-title{align-items:center;justify-content:center;text-align:center;padding:20px}
.t-logo{font-family:'Orbitron',sans-serif;font-size:clamp(2.2rem,7vw,4.5rem);font-weight:900;
  letter-spacing:0.18em;color:var(--white);
  text-shadow:0 0 12px var(--willow),0 0 35px var(--willow),0 0 80px rgba(168,230,207,0.4);
  animation:logoPulse 3s ease-in-out infinite;margin-bottom:4px}
@keyframes logoPulse{0%,100%{text-shadow:0 0 12px var(--willow),0 0 35px var(--willow),0 0 80px rgba(168,230,207,0.3)}
  50%{text-shadow:0 0 18px var(--willow),0 0 50px var(--willow),0 0 100px rgba(168,230,207,0.55)}}
.t-sub{font-family:'VT323',monospace;font-size:1.1rem;letter-spacing:0.35em;color:var(--willow2);margin-bottom:6px}
.t-ded{font-size:0.6rem;color:rgba(168,230,207,0.5);letter-spacing:0.15em;font-style:italic;
  margin-bottom:30px;cursor:pointer;transition:color .2s}
.t-ded:hover{color:var(--willow)}
.t-lore{display:none;max-width:440px;margin:0 auto 18px;padding:12px 16px;text-align:left;
  font-size:0.62rem;line-height:1.9;color:var(--txt2);letter-spacing:0.02em;
  background:rgba(0,0,0,0.35);border:1px solid var(--rim2);border-left:2px solid var(--willow2)}
.t-lore.show{display:block;animation:scIn .3s ease both}
.t-press{font-family:'VT323',monospace;font-size:1.4rem;letter-spacing:0.2em;color:var(--willow);
  animation:blink 1.1s step-start infinite;cursor:pointer;margin-bottom:18px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.t-waves{display:none;margin-top:6px}
.t-waves.show{display:block}
.t-waves-lbl{font-size:0.52rem;color:var(--txt2);letter-spacing:0.2em;margin-bottom:7px}
.t-wave-grid{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.t-wb{padding:4px 10px;font-family:'VT323',monospace;font-size:0.9rem;border:1px solid var(--rim2);
  color:var(--txt2);background:rgba(0,0,0,0.3);cursor:pointer;transition:all .15s;letter-spacing:.05em}
.t-wb:hover{border-color:var(--willow2);color:var(--willow)}

/* ════════════════════════════════════
   PREP SCREEN
════════════════════════════════════ */
#sc-prep{overflow-y:auto;padding:10px 14px;gap:8px}
.prep-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.prep-cols{grid-template-columns:1fr}}
.pnl{background:var(--panel);border:1px solid var(--rim);padding:11px;position:relative;overflow:hidden}
.pnl::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--willow-dim),transparent)}
.pnl-hd{font-family:'Orbitron',sans-serif;font-size:0.5rem;letter-spacing:0.28em;
  color:var(--willow2);text-transform:uppercase;border-bottom:1px solid var(--rim);
  padding-bottom:7px;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.pnl-hd::before{content:'◈';font-size:0.65rem}
.slot-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.slot{width:46px;height:46px;border:2px solid var(--rim2);background:rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;
  position:relative;transition:all .12s;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.slot:hover{border-color:var(--willow);transform:scale(1.07);box-shadow:0 0 10px rgba(168,230,207,0.25)}
.slot.filled{border-color:var(--willow2)}
.slot-x{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;
  background:#c62828;color:#fff;font-size:0.5rem;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:1px solid #ff5252}
.mat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mat-orb{padding:7px 3px;border:1px solid var(--rim);background:rgba(0,0,0,0.3);
  text-align:center;cursor:pointer;transition:all .12s;
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.mat-orb:hover{transform:scale(1.05);background:rgba(168,230,207,0.05);border-color:var(--willow2)}
.mi{font-size:1.1rem;display:block}
.mn{font-size:0.48rem;color:var(--txt2);margin-top:1px;display:block}
.mc{font-size:0.44rem;color:var(--mp);display:block}
.ei-wrap{display:flex;align-items:flex-start;gap:10px;background:rgba(0,0,0,0.28);
  border:1px solid var(--rim);padding:10px;margin-bottom:8px;position:relative;overflow:hidden}
.ei-wrap::after{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,79,31,0.04) 0%,transparent 55%);pointer-events:none}
.ei-emj{font-size:2.8rem;flex-shrink:0;animation:floatBob 3s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(255,79,31,0.35))}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ei-name{font-family:'Orbitron',sans-serif;font-size:0.68rem;color:var(--fire2);letter-spacing:0.08em;margin-bottom:4px}
.ei-st{font-size:0.55rem;color:var(--txt2);line-height:1.9}
.ei-st b{color:var(--txt)}
.ei-tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px}
.ei-tag{font-size:0.42rem;letter-spacing:0.1em;padding:1px 5px;
  background:rgba(255,79,31,0.1);border:1px solid rgba(255,79,31,0.25);
  color:var(--fire2);text-transform:uppercase}
.ei-tip{font-size:0.55rem;color:var(--txt2);line-height:1.7;padding:5px 7px;
  background:rgba(0,0,0,0.2);border-left:2px solid var(--rim2);margin-bottom:9px}
.btn-start{display:block;width:100%;padding:12px;font-family:'Orbitron',sans-serif;
  font-size:0.65rem;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;
  background:linear-gradient(90deg,#081a12,#0c3020);color:var(--willow);
  border:1px solid var(--willow2);cursor:pointer;position:relative;overflow:hidden;transition:all .2s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn-start::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(168,230,207,0.08),transparent);
  transform:translateX(-100%);transition:transform .5s}
.btn-start:hover::before{transform:translateX(100%)}
.btn-start:hover{background:linear-gradient(90deg,#0c3020,#0f4a30);box-shadow:0 0 18px rgba(168,230,207,0.28)}
.btn-start:disabled{opacity:0.3;cursor:not-allowed}

/* ════════════════════════════════════
   BATTLE SCREEN — UPGRADED
════════════════════════════════════ */
#sc-battle{flex-direction:column;gap:0}

/* ── ARENA — RETRO PIXEL STYLE ── */
#arena{
  position:relative;flex-shrink:0;height:340px;overflow:hidden;
  background:linear-gradient(180deg,#1a0f2e 0%,#2d1b3d 40%,#1f1428 80%,#0a0510 100%);
  border-bottom:4px solid #2a2a2a;
  image-rendering:pixelated;
}

/* Simple background — just a dark scene */
#arena-far{position:absolute;inset:0;opacity:0.4;background:repeating-linear-gradient(
  90deg,#1a0f2e 0px,#1a0f2e 2px,#2d1b3d 2px,#2d1b3d 4px)}

/* Midground — drifting ruin silhouettes, parallax depth layer */
#arena-mid{
  position:absolute;bottom:56px;left:-10%;right:-10%;height:110px;
  background:
    linear-gradient(105deg,transparent 0 38%,#140a24 38% 46%,transparent 46%),
    linear-gradient(75deg,transparent 0 58%,#140a24 58% 64%,transparent 64%),
    linear-gradient(95deg,transparent 0 74%,#180c28 74% 84%,transparent 84%),
    linear-gradient(85deg,transparent 0 12%,#180c28 12% 20%,transparent 20%);
  clip-path:polygon(0 100%,4% 62%,10% 78%,16% 48%,24% 70%,30% 40%,38% 66%,46% 30%,
    54% 60%,62% 22%,70% 58%,78% 34%,86% 64%,94% 44%,100% 70%,100% 100%);
  opacity:0.55;filter:blur(0.5px);
  animation:midDrift 40s linear infinite;
}
@keyframes midDrift{0%{transform:translateX(0)}100%{transform:translateX(-8%)}}

/* Minimal city silhouette */
#arena-city{
  position:absolute;bottom:0;left:0;right:0;height:60px;
  background:repeating-linear-gradient(90deg,
    #0a0510 0px,#0a0510 8px,#0f0a1a 8px,#0f0a1a 12px,
    #0a0510 12px,#0a0510 18px,#0f0a1a 18px,#0f0a1a 24px,
    #0a0510 24px,#0a0510 32px,#0f0a1a 32px,#0f0a1a 40px);
  opacity:0.6;
}

/* Minimal mako effect — just simple vertical lines */
#arena-mako{position:absolute;bottom:0;left:0;right:0;height:100%;pointer-events:none}
.mako-col{
  position:absolute;bottom:0;width:2px;
  background:#5ec9a0;opacity:0;
  animation:makoRise 6s ease-in-out infinite;
}
.mako-col:nth-child(1){left:12%;animation-delay:0s}
.mako-col:nth-child(2){left:28%;animation-delay:1s}
.mako-col:nth-child(3){left:42%;animation-delay:2s}
.mako-col:nth-child(4){left:58%;animation-delay:3s}
.mako-col:nth-child(5){left:72%;animation-delay:4s}
.mako-col:nth-child(6){left:88%;animation-delay:5s}
@keyframes makoRise{0%{opacity:0;height:0}10%{opacity:0.8}50%{opacity:0.3;height:60%}90%{opacity:0}}

/* Ground — just a line */
#arena-floor{
  position:absolute;bottom:40px;left:0;right:0;height:2px;
  background:#2a2a2a;box-shadow:0 2px 0 #1a1a1a;
}
#arena-floor::before{display:none}

/* Ambient ground-light pools — adds depth beneath each combatant */
#glow-p,#glow-e{
  position:absolute;bottom:42px;width:130px;height:56px;
  border-radius:50%;pointer-events:none;filter:blur(6px);
  transition:background .6s ease;z-index:1;
}
#glow-p{left:12%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,var(--willow-glow) 0%,transparent 72%)}
#glow-e{right:12%;transform:translateX(50%);
  background:radial-gradient(ellipse at center,rgba(255,79,31,0.3) 0%,transparent 72%)}

/* Contact shadows — grounds the sprites, squashes on the attack lunge */
.spr-p::after,.spr-e::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:70%;height:10px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.55) 0%,transparent 75%);
  transition:width .2s,opacity .2s;
}
.cw.attack-r .spr-p::after,.cw.attack-l .spr-p::after,
.cw.attack-r .spr-e::after,.cw.attack-l .spr-e::after{width:46%;opacity:0.6}

/* Tint — subtle only */
#arena-tint{position:absolute;inset:0;pointer-events:none;transition:background 0.8s ease;opacity:0.06}

/* ── CHARACTER POSITIONING ── */
.cw{position:absolute;bottom:50px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:filter .2s}
#cw-p{left:12%}
#cw-e{right:12%}
.c-lbl{font-family:'VT323',monospace;font-size:1rem;letter-spacing:0.08em;
  text-shadow:0 0 12px currentColor;text-align:center;min-height:18px}
.c-lbl.pl{color:var(--willow);text-shadow:0 0 8px var(--willow),0 0 16px rgba(168,230,207,0.4)}
.c-lbl.en{color:var(--fire2);text-shadow:0 0 8px var(--fire2),0 0 16px rgba(255,79,31,0.4)}
.c-turn-ind{font-size:0.65rem;color:var(--thunder);opacity:0;font-weight:bold}
.c-turn-ind.active{opacity:1;animation:turnFlash .5s ease-in-out infinite}
@keyframes turnFlash{0%,100%{opacity:0.4;text-shadow:0 0 2px var(--thunder)}50%{opacity:1;text-shadow:0 0 8px var(--thunder)}}

/* ── PLAYER SPRITE (Noom Wolliw) — PIXEL ART ── */
.spr-p{position:relative;width:64px;height:80px;image-rendering:pixelated}
.spr-p .p-glow{
  position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:44px;height:60px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,230,207,0.28) 0%,transparent 72%);
  filter:blur(3px);animation:auraPulse 3s ease-in-out infinite;
}
@keyframes auraPulse{0%,100%{opacity:0.6;transform:translateX(-50%) scale(0.92)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
.spr-p .p-wL,.spr-p .p-wR{position:absolute;top:12px;width:16px;height:24px;
  background:#5ec9a0;border:1px solid #3aab82;
  animation:wFlap 1.2s step(2,end) infinite}
.spr-p .p-wL{right:28px;transform-origin:right center}
.spr-p .p-wR{left:28px;animation-delay:0.1s;transform-origin:left center}
@keyframes wFlap{0%,100%{transform:skewY(-6px)}50%{transform:skewY(6px)}}
.spr-p .p-body{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  width:14px;height:20px;background:#a8e6cf;border:1px solid #5ec9a0}
.spr-p .p-head{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;background:#c8f0df;border:1px solid #5ec9a0}
.spr-p .p-hair{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
  width:14px;height:6px;background:#3aab82;border:1px solid #2a8a62}
.spr-p .p-orb{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;background:#5ec9a0;border:1px solid #3aab82;
  animation:orbPop 1.6s step(2,end) infinite}
@keyframes orbPop{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.3)}}
.spr-p .p-arm{position:absolute;bottom:18px;width:4px;height:8px;background:#a8e6cf;border:1px solid #5ec9a0}
.spr-p .p-armL{right:24px}
.spr-p .p-armR{left:24px}

/* ── ENEMY SPRITES — PIXEL ART ── */
.spr-e{position:relative;image-rendering:pixelated}

/* Trooper — soldier with rifle */
.se-trooper{width:48px;height:64px}
.se-trooper .et-body{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  width:12px;height:24px;background:#4a6a9a;border:1px solid #1a3a6a}
.se-trooper .et-head{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;background:#5a7aaa;border:1px solid #1a3a6a}
.se-trooper .et-visor{position:absolute;bottom:39px;left:50%;transform:translateX(-50%);
  width:8px;height:4px;background:#7ecfff;border:1px solid #5aafdd}
.se-trooper .et-rifle{position:absolute;bottom:20px;right:12px;
  width:2px;height:20px;background:#2a4a7a;border:1px solid #1a2a5a;transform:rotate(-30deg);transform-origin:top}
.se-trooper .et-legs{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:10px;height:14px;background:#1a3a6a;border:1px solid #0a1a4a}

/* Mech — blocky robot */
.se-mech{width:52px;height:68px}
.se-mech .em-core{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  width:18px;height:28px;background:#3a3a0a;border:1px solid #ff4f1f}
.se-mech .em-eye{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  width:12px;height:6px;background:#ff4f1f;
  animation:mechEye .8s step(2,end) infinite}
@keyframes mechEye{0%,100%{opacity:1}50%{opacity:0.3}}
.se-mech .em-scan{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);
  width:14px;height:2px;border:1px solid #ff8c5a;opacity:0.6}
.se-mech .em-arm{position:absolute;bottom:20px;width:6px;height:18px;
  background:#2a2a0a;border:1px solid #1a1a0a}
.se-mech .em-armL{right:20px}.se-mech .em-armR{left:20px}
.se-mech .em-leg{position:absolute;bottom:0;width:4px;height:14px;
  background:#1a1a0a;border:1px solid #0a0a0a}
.se-mech .em-legL{right:16px}.se-mech .em-legR{left:16px}
.se-mech .em-vent{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  width:10px;height:2px;background:repeating-linear-gradient(90deg,#ff8c5a 0px,#ff8c5a 2px,transparent 2px,transparent 3px);
  opacity:0.8}

/* Beast — crouched animal */
.se-beast{width:60px;height:54px}
.se-beast .eb-body{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  width:28px;height:20px;background:#2a0a0a;border:1px solid #ff4f1f}
.se-beast .eb-head{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  width:18px;height:16px;background:#3a1a1a;border:1px solid #ff8c5a}
.se-beast .eb-eye{position:absolute;top:2px;left:35%;
  width:6px;height:6px;background:#ff4f1f;border:1px solid #ff0000}
.se-beast .eb-eye2{left:65%}
.se-beast .eb-tail{position:absolute;bottom:12px;right:26px;
  width:3px;height:22px;background:#1a0a0a;border:1px solid #0a0a0a;
  transform:rotate(-35deg);transform-origin:top center;
  animation:tailWag .5s step(2,end) infinite}
@keyframes tailWag{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(-15deg)}}
.se-beast .eb-leg{position:absolute;bottom:0;width:3px;height:10px;
  background:#1a0a0a;border:1px solid #0a0a0a}
.se-beast .eb-legA{left:12px}.se-beast .eb-legB{left:18px}
.se-beast .eb-legC{right:18px}.se-beast .eb-legD{right:12px}

/* Alien — tentacle creature */
.se-alien{width:60px;height:70px}
.se-alien .ea-body{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  width:20px;height:24px;background:#2a0a4a;border:1px solid #c05aff}
.se-alien .ea-head{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);
  width:18px;height:18px;background:#3a1a5a;border:1px solid #c05aff}
.se-alien .ea-eye{position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;background:#c05aff;border:1px solid #a03aff}
.se-alien .ea-tent{position:absolute;bottom:36px;width:2px;
  background:#c05aff;border:1px solid #a03aff;transform-origin:top center;
  animation:tentWave 1s step(2,end) infinite}
.se-alien .ea-tentL{right:20px;height:16px}
.se-alien .ea-tentR{left:20px;height:16px;animation-delay:0.2s}
.se-alien .ea-tentL2{right:26px;height:12px;animation-delay:0.4s}
.se-alien .ea-tentR2{left:26px;height:12px;animation-delay:0.6s}
@keyframes tentWave{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}

/* Boss — armored demon */
.se-boss{width:68px;height:80px}
.se-boss .eb2-body{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:26px;height:32px;background:#4a1a0a;border:1px solid #ff4f1f}
.se-boss .eb2-head{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  width:20px;height:14px;background:#4a1a0a;border:1px solid #ff8c5a}
.se-boss .eb2-eye{position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:12px;height:4px;background:#ff4f1f;
  animation:bossEye 0.8s step(2,end) infinite}
@keyframes bossEye{0%,100%{opacity:1}50%{opacity:0.3}}
.se-boss .eb2-shoulder{position:absolute;bottom:28px;width:10px;height:8px;
  background:#3a0a00;border:1px solid #ff8c5a}
.se-boss .eb2-sL{right:32px}.se-boss .eb2-sR{left:32px}
.se-boss .eb2-arm{position:absolute;bottom:16px;width:6px;height:18px;
  background:#2a0a00;border:1px solid #ff8c5a}
.se-boss .eb2-armL{right:34px}.se-boss .eb2-armR{left:34px}
.se-boss .eb2-aura{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,79,31,0.35) 0%,transparent 70%);
  filter:blur(4px);animation:auraPulse 2.2s ease-in-out infinite;
}

/* Ashveil — pale one-winged angel */
.se-seph{width:70px;height:90px}
.se-seph .es-coat{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:18px;height:54px;background:#1a1a2e;border:1px solid #5a5a8a}
.se-seph .es-body{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  width:14px;height:18px;background:#3a3a4a;border:1px solid #5a5a8a}
.se-seph .es-head{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;background:#e0e0f0;border:1px solid #8a8aaa}
.se-seph .es-hair{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  width:3px;height:40px;background:#9090bb;border:1px solid #7070aa}
.se-seph .es-wing{position:absolute;bottom:30px;right:18px;width:24px;height:32px;
  background:#1a1a2e;border:1px solid #5a5a8a;
  clip-path:polygon(100% 0,0 100%,100% 100%);
  animation:wingDrift 4s step(2,end) infinite;transform-origin:100% 0}
@keyframes wingDrift{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.se-seph .es-blade{position:absolute;bottom:4px;right:2px;width:2px;height:48px;
  background:#a0c0ff;border:1px solid #6080dd;transform:rotate(-10deg);transform-origin:bottom center}
.se-seph .es-aura{
  position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:100px;height:124px;border-radius:50%;
  background:radial-gradient(circle,rgba(160,140,255,0.32) 0%,transparent 70%);
  filter:blur(5px);animation:auraPulse 2.6s ease-in-out infinite;
}

/* ── CHARACTER ANIMATIONS ── */
.cw.attack-r{animation:atkR .4s cubic-bezier(.4,0,.2,1)}
.cw.attack-l{animation:atkL .4s cubic-bezier(.4,0,.2,1)}
@keyframes atkR{0%,100%{transform:translateX(0)}35%{transform:translateX(80px)}70%{transform:translateX(60px)}}
@keyframes atkL{0%,100%{transform:translateX(0)}35%{transform:translateX(-80px)}70%{transform:translateX(-60px)}}
.cw.hit{animation:hitAnim .45s ease}
@keyframes hitAnim{0%,100%{filter:none}15%{filter:brightness(3.5) saturate(0) contrast(2.2)}45%{filter:brightness(2) saturate(0.2) contrast(1.5)}}
#sc-battle.shake{animation:screenShake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes screenShake{0%,100%{transform:translateX(0) translateY(0)}8%{transform:translateX(-9px) translateY(-6px)}16%{transform:translateX(9px) translateY(6px)}24%{transform:translateX(-7px) translateY(-4px)}32%{transform:translateX(8px) translateY(5px)}40%{transform:translateX(-5px) translateY(-3px)}48%{transform:translateX(6px) translateY(4px)}56%{transform:translateX(-3px) translateY(-2px)}64%{transform:translateX(4px) translateY(3px)}}

/* Shockwave */
#shockwave{position:fixed;inset:0;pointer-events:none;z-index:9998;display:none;border-radius:50%;border:2px solid var(--limit)}
#shockwave.go{display:block;animation:swAnim .8s ease-out forwards}
@keyframes swAnim{0%{transform:scale(0);opacity:1}50%{transform:scale(2);opacity:0.6}100%{transform:scale(4.5);opacity:0}}

/* Chromatic aberration on limit */
#chroma{position:fixed;inset:0;pointer-events:none;z-index:9997;display:none;mix-blend-mode:screen}
#chroma.go{display:block;animation:chromaAnim .6s ease-out forwards}
@keyframes chromaAnim{
  0%{background:linear-gradient(45deg,rgba(255,0,0,0.2),rgba(0,0,255,0.2));filter:blur(3px)}
  35%{background:linear-gradient(45deg,rgba(255,0,0,0.12),rgba(0,0,255,0.12));filter:blur(1.5px)}
  100%{background:transparent;filter:none}
}

/* ── BATTLE HUD — JRPG STYLE BOTTOM PANEL ── */
#bhud{
  display:grid;grid-template-columns:1fr 1fr;
  flex-shrink:0;border-top:3px solid var(--rim2);
  background:linear-gradient(180deg,rgba(10,22,40,0.95),rgba(13,30,54,0.92));
  box-shadow:inset 0 2px 8px rgba(168,230,207,0.08);
}
.bc{padding:14px 16px;position:relative;overflow:hidden}
.bc.bcp{border-right:2px solid var(--rim2)}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.bcp::before{background:linear-gradient(90deg,var(--willow2),transparent)}
.bce::before{background:linear-gradient(90deg,transparent,var(--fire2))}
.bc-name{font-family:'Orbitron',sans-serif;font-size:0.6rem;letter-spacing:0.14em;margin-bottom:8px;font-weight:700;text-transform:uppercase}
.bc-name.pn{color:var(--willow)}
.bc-name.en{color:var(--fire2)}
.brow{margin-bottom:6px}
.blbl{font-family:'VT323',monospace;font-size:0.85rem;color:var(--txt2);
  display:flex;justify-content:space-between;margin-bottom:2px;letter-spacing:0.05em}
.bval{color:var(--txt);font-size:0.8rem;font-weight:600}

/* Segmented pip bars — larger and more prominent */
.btrack{height:12px;background:rgba(0,0,0,0.7);border:1px solid var(--rim);
  position:relative;overflow:hidden;display:flex;gap:1.5px;padding:1.5px}
.bseg{flex:1;height:100%;transition:background .2s,box-shadow .2s;border-radius:1px}
.bseg.on-hp{background:var(--hp-hi)}
.bseg.on-hp.mid{background:var(--hp-mid)}
.bseg.on-hp.lo{background:var(--hp-lo)}
.bseg.on-mp{background:var(--mp)}
.bseg.on-atb{background:var(--willow2);box-shadow:0 0 6px var(--willow2),inset 0 0 2px rgba(255,255,255,0.4)}
.bseg.on-atbe{background:var(--fire);box-shadow:0 0 6px var(--fire),inset 0 0 2px rgba(255,255,255,0.2)}
.bseg.on-lim{background:var(--limit);box-shadow:0 0 8px var(--limit),inset 0 0 2px rgba(255,255,255,0.3)}
.bseg.off{background:rgba(255,255,255,0.06)}

/* ATB ready flash */
.btrack.atb-ready{animation:atbFlash .5s ease-in-out infinite}
@keyframes atbFlash{0%,100%{box-shadow:0 0 2px var(--rim);opacity:0.9}50%{box-shadow:0 0 12px var(--willow),0 0 20px rgba(168,230,207,0.5);opacity:1}}
.btrack.atb-ready-e{animation:atbFlashE .5s ease-in-out infinite}
@keyframes atbFlashE{0%,100%{box-shadow:0 0 2px var(--rim);opacity:0.9}50%{box-shadow:0 0 12px var(--fire),0 0 20px rgba(255,79,31,0.5);opacity:1}}

.lo-row{display:flex;gap:4px;margin-top:7px;align-items:center;flex-wrap:wrap}
.lo-orb{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;border:1.5px solid rgba(255,255,255,0.2);box-shadow:0 0 4px rgba(255,255,255,0.1)}
.lo-combo{font-size:0.5rem;color:var(--thunder);margin-left:5px;letter-spacing:0.08em;font-weight:600}
.weak-row{font-size:0.52rem;color:var(--txt2);margin-top:5px;line-height:1.8;letter-spacing:0.04em}
.weak-row .w{color:var(--fire2);font-weight:600}.weak-row .r{color:var(--ice);font-weight:600}

/* ── STATUS BADGES ── */
.status-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;min-height:16px}
.sbadge{font-size:0.45rem;padding:2px 6px;border-radius:2px;letter-spacing:0.1em;text-transform:uppercase;
  border:1px solid;animation:badgePop .25s cubic-bezier(.36,.07,.19,.97);font-weight:600}
@keyframes badgePop{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
.sbadge.wall{background:rgba(192,90,255,0.18);border-color:var(--dark);color:var(--dark)}
.sbadge.slow{background:rgba(126,207,255,0.18);border-color:var(--ice);color:var(--ice)}
.sbadge.silence{background:rgba(255,79,31,0.12);border-color:var(--fire2);color:var(--fire2)}

/* ── DIALOGUE BOX LOG ── */
#log-wrap{flex:1;min-height:0;overflow:hidden;border-top:2px solid var(--rim2);
  background:linear-gradient(180deg,rgba(10,22,40,0.5),rgba(13,30,54,0.5));
  padding:12px 14px;position:relative}
#log-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--rim2),transparent)}
#log-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--rim2),transparent)}
#blog{
  height:100%;overflow-y:auto;overflow-x:hidden;
  font-family:'VT323',monospace;font-size:0.95rem;
  line-height:1.6;color:var(--txt);display:flex;flex-direction:column;gap:8px
}

/* Typewriter effect for new log entries */
.log-entry{animation:typeIn .3s steps(40,end);opacity:1}
@keyframes typeIn{from{opacity:0;max-height:0}to{opacity:1;max-height:100px}}

.lo{color:var(--txt)}
.lp{color:var(--willow);text-shadow:0 0 6px var(--willow)}
.lk{color:var(--thunder);font-weight:bold}
.ls{color:var(--fire2);text-shadow:0 0 6px var(--fire2)}
.lh{color:var(--restore);text-shadow:0 0 6px var(--restore)}
.lc{color:var(--thunder);text-shadow:0 0 6px var(--thunder)}
.lm{color:var(--txt2);font-size:0.85rem}

/* ── ACTION BUTTONS — LARGE & ELEMENT-COLORED ── */
#arow{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;
  padding:12px 14px;background:rgba(0,0,0,0.4);
  border-top:2px solid var(--rim);flex-shrink:1;min-height:60px;
  max-height:42vh;overflow-y:auto
}
.act{
  flex:1;min-width:140px;padding:14px 12px;font-family:'Orbitron',sans-serif;
  font-size:0.7rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  border:2px solid;cursor:pointer;position:relative;overflow:hidden;
  transition:all .15s;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  white-space:nowrap
}
.act::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,0.1),transparent);
  transform:translateX(-100%);transition:transform .4s}
.act:hover:not(:disabled)::before{transform:translateX(100%)}
.act:disabled{opacity:0.35;cursor:not-allowed}
.act-key{font-size:0.55rem;color:rgba(255,255,255,0.5);font-weight:400;letter-spacing:0.08em}
.act-sub{font-size:0.6rem;opacity:0.8}
.act-sub.warn{color:#ff6b6b}

/* Element-colored buttons */
.act-atk{
  background:linear-gradient(135deg,rgba(255,79,31,0.25),rgba(255,79,31,0.12));
  border-color:var(--fire);color:var(--fire2);
  box-shadow:0 0 0 1px inset rgba(255,79,31,0.4)}
.act-atk:hover:not(:disabled){
  background:linear-gradient(135deg,rgba(255,79,31,0.4),rgba(255,79,31,0.2));
  box-shadow:0 0 16px rgba(255,79,31,0.5),0 0 0 1px inset rgba(255,79,31,0.6)}

.act-mag{
  background:linear-gradient(135deg,rgba(126,207,255,0.25),rgba(126,207,255,0.12));
  border-color:var(--ice);color:var(--ice);
  box-shadow:0 0 0 1px inset rgba(126,207,255,0.4)}
.act-mag:hover:not(:disabled){
  background:linear-gradient(135deg,rgba(126,207,255,0.4),rgba(126,207,255,0.2));
  box-shadow:0 0 16px rgba(126,207,255,0.5),0 0 0 1px inset rgba(126,207,255,0.6)}

.act-lim{
  background:linear-gradient(135deg,rgba(255,109,0,0.3),rgba(255,109,0,0.15));
  border-color:var(--limit);color:var(--limit);
  box-shadow:0 0 0 1px inset rgba(255,109,0,0.4)}
.act-lim:hover:not(:disabled){
  background:linear-gradient(135deg,rgba(255,109,0,0.45),rgba(255,109,0,0.25));
  box-shadow:0 0 18px rgba(255,109,0,0.6),0 0 0 1px inset rgba(255,109,0,0.7)}

.act-itm{
  background:linear-gradient(135deg,rgba(76,255,159,0.2),rgba(76,255,159,0.08));
  border-color:var(--wind);color:var(--wind);
  box-shadow:0 0 0 1px inset rgba(76,255,159,0.3)}
.act-itm:hover:not(:disabled){
  background:linear-gradient(135deg,rgba(76,255,159,0.35),rgba(76,255,159,0.15));
  box-shadow:0 0 16px rgba(76,255,159,0.5),0 0 0 1px inset rgba(76,255,159,0.5)}

/* Turn indicator in action row */
#atb-lbl{
  font-family:'Orbitron',sans-serif;font-size:0.75rem;letter-spacing:0.15em;
  font-weight:700;text-transform:uppercase;padding:12px 14px;text-align:center;
  flex-shrink:0;background:rgba(0,0,0,0.3);border-top:1px solid var(--rim);
  color:var(--txt2);text-shadow:0 0 4px rgba(0,0,0,0.8)
}
#atb-lbl.rdy{
  color:var(--willow);text-shadow:0 0 8px var(--willow),0 0 16px rgba(168,230,207,0.4);
  animation:readyPulse .6s ease-in-out infinite
}
@keyframes readyPulse{0%,100%{opacity:0.9}50%{opacity:1;text-shadow:0 0 12px var(--willow),0 0 24px rgba(168,230,207,0.6)}}
#atb-lbl.wait{
  color:var(--txt2);animation:waitBlink 1s step-start infinite
}
@keyframes waitBlink{0%,50%{opacity:1}51%,100%{opacity:0.4}}

/* Scrollbar styling */
#blog::-webkit-scrollbar{width:6px}
#blog::-webkit-scrollbar-track{background:rgba(0,0,0,0.3);border-radius:3px}
#blog::-webkit-scrollbar-thumb{background:var(--rim2);border-radius:3px}
#blog::-webkit-scrollbar-thumb:hover{background:var(--willow2)}

/* ════════════════════════════════════
   UNO HAND — CARD-BASED ACTION SELECT
════════════════════════════════════ */
.uno-hand{display:flex;gap:9px;flex-wrap:wrap;padding:12px 14px;align-items:center;
  background:rgba(0,0,0,0.4);border-top:2px solid var(--rim);perspective:700px}
.uno-card{
  --card-col:#888;--tilt:0deg;width:66px;height:94px;border-radius:11px;flex-shrink:0;cursor:pointer;
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--card-col),color-mix(in srgb,var(--card-col) 60%,#000));
  border:3px solid rgba(255,255,255,0.85);box-shadow:0 4px 10px rgba(0,0,0,0.55),inset 0 0 12px rgba(255,255,255,0.12);
  transform:rotate(var(--tilt));transform-style:preserve-3d;
  transition:transform .18s ease,box-shadow .18s ease;
}
.uno-card:nth-child(3n+1){--tilt:-3deg}
.uno-card:nth-child(3n+2){--tilt:1deg}
.uno-card:nth-child(3n+3){--tilt:3deg}
.uno-card:hover{transform:rotate(var(--tilt)) translateY(-10px) rotateX(14deg) scale(1.06);
  box-shadow:0 14px 22px rgba(0,0,0,0.65),0 0 16px var(--card-col)}
.uno-card.disabled{opacity:0.32;cursor:not-allowed;filter:grayscale(0.7);transform:rotate(var(--tilt));box-shadow:none}
.uno-card::before{content:'';position:absolute;inset:6px;border-radius:50%/38%;
  background:rgba(255,255,255,0.14);transform:rotate(-18deg)}
.uc-corner{position:absolute;top:4px;left:6px;font-size:0.6rem;color:#fff;text-shadow:0 0 3px #000}
.uc-icon{font-size:1.6rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.6));z-index:1}
.uc-name{font-family:'Orbitron',sans-serif;font-size:0.4rem;letter-spacing:0.05em;color:#fff;
  text-transform:uppercase;margin-top:3px;text-align:center;padding:0 3px;z-index:1;text-shadow:0 0 3px #000}
.uc-mp{position:absolute;bottom:4px;right:5px;font-size:0.44rem;color:#fff;
  background:rgba(0,0,0,0.45);padding:1px 4px;border-radius:6px;z-index:1}

/* ── DICE PANEL — YAHTZEE POWER ROLL ── */
.dice-panel{display:flex;flex-direction:column;gap:9px;padding:12px 14px;
  background:rgba(0,0,0,0.4);border-top:2px solid var(--rim)}
.dice-info{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;
  font-family:'Orbitron',sans-serif;font-size:0.58rem;letter-spacing:0.08em;color:var(--txt)}
.dice-score{color:var(--thunder);text-shadow:0 0 6px var(--thunder)}
.dice-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;position:relative;padding:4px 0 12px}
.dice-row::before{content:'';position:absolute;left:14%;right:14%;bottom:0;height:10px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.45) 0%,transparent 78%);filter:blur(1.5px)}
.die{width:44px;height:44px;border-radius:8px;border:2px solid #1a1a1a;
  background:linear-gradient(160deg,#ffffff,#d6dbe0);
  box-shadow:0 3px 0 #aeb5bb,0 6px 8px rgba(0,0,0,0.4);
  display:grid;place-items:center;cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .15s;user-select:none}
.die.held{border-color:var(--thunder);background:linear-gradient(160deg,#fff8dc,#ffe58a);
  box-shadow:0 3px 0 #c9a227,0 0 12px var(--thunder),0 6px 10px rgba(0,0,0,0.4)}
.die:not(.held):hover{transform:translateY(-4px);box-shadow:0 7px 0 #aeb5bb,0 10px 14px rgba(0,0,0,0.5)}
.die-q{font-size:1.3rem;font-weight:900;color:#8a8f96}
.pip-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:30px;height:30px;gap:2px}
.pip{border-radius:50%}
.pip.on{background:#1a1a1a}
.dice-btns{display:flex;gap:8px;flex-wrap:wrap}
.dice-btns .act{flex:1;min-width:110px;padding:10px 8px;font-size:0.6rem}

/* ── RESPONSIVE — keep the combat log breathing room on short/narrow screens ── */
@media(max-height:760px){
  #arena{height:200px}
  .ei-emj{font-size:2.2rem}

// ── AMBIENT PARTICLES ──
(function initParticles(){
  const cv=document.getElementById('particle-cv');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  let w=0,h=0,parts=[];
  function resize(){
    w=cv.width=cv.offsetWidth||window.innerWidth;
    h=cv.height=cv.offsetHeight||window.innerHeight;
  }
  function spawn(){
    const far=Math.random()<0.55;
    return{
      x:Math.random()*w,y:h+Math.random()*40,
      r:far?0.6+Math.random()*1.1:1.8+Math.random()*2.6,
      vy:far?0.12+Math.random()*0.22:0.35+Math.random()*0.7,
      vx:(Math.random()-0.5)*(far?0.25:0.5),
      a:far?0.08+Math.random()*0.14:0.18+Math.random()*0.32,
      hue:Math.random()<0.7?'168,230,207':'255,140,90',
      wob:Math.random()*Math.PI*2,
      blur:far?0:1+Math.random()*1.5,
    };
  }
  function init(){
    resize();
    const n=Math.min(70,Math.floor((w*h)/20000));
    parts=Array.from({length:n},()=>{const p=spawn();p.y=Math.random()*h;return p;});
  }
  function tickParticles(){
    ctx.clearRect(0,0,w,h);
    parts.forEach(p=>{
      p.wob+=0.02;
      p.y-=p.vy;p.x+=p.vx+Math.sin(p.wob)*0.15;
      if(p.y<-10){Object.assign(p,spawn());p.y=h+10;}
      if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;
      ctx.filter=p.blur?`blur(${p.blur}px)`:'none';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.hue},${p.a})`;
      ctx.fill();
    });
    ctx.filter='none';
    requestAnimationFrame(tickParticles);
  }
  window.addEventListener('resize',resize);
  init();
  requestAnimationFrame(tickParticles);
})();

// ── LOG ──
function log(txt,cls='lo'){
  const b=document.getElementById('blog');
  const e=document.createElement('div');
  e.className=`log-entry ${cls}`;e.textContent=txt;b.appendChild(e);
  b.scrollTop=b.scrollHeight;
}

// ── DAMAGE ──
function elMod(el){
  if(!el||!S.enemy)return 1;
  if(S.enemy.weak.includes(el))return 1.5;
  if(S.enemy.res.includes(el))return 0.6;
  return 1;
}
function calcD(atk,def,mul,el){return Math.floor(atk*mul*elMod(el) - def*0.5 + Math.random()*8)}
function popD(d,cls,tar){
  const t=document.querySelector(tar);if(!t)return;
  const p=document.createElement('div');p.style.cssText=`
    position:absolute;left:${t.offsetLeft+t.offsetWidth/2}px;top:${t.offsetTop-20}px;
    font-family:Orbitron,sans-serif;font-weight:700;font-size:1.4rem;pointer-events:none;
    animation:popFl .8s ease both;z-index:100`;
  p.textContent=d;p.className=cls;
  const c={dp:'#00e676',dk:'#ff9800',dh:'#00ff88',dw:'#f7d84b',dr:'#8a8f96'}[cls]||'#fff';
  p.style.color=c;p.style.textShadow=`0 0 8px ${c}`;
  document.getElementById('arena').appendChild(p);
  const st=p.style;st.setProperty('--dur','0.8s');
}

// ── ANIMATIONS ──
function atkSlide(src,tgt){
  const s=document.querySelector('#'+src),t=document.querySelector('#'+tgt);
  s.classList.add('attack-'+(src==='cw-p'?'r':'l'));
  setTimeout(()=>s.classList.remove('attack-'+(src==='cw-p'?'r':'l')),500);
}
function hitFl(el){
  const e=document.querySelector('#'+el);e.classList.add('hit');
  setTimeout(()=>e.classList.remove('hit'),450);
}
function screenShake(){
  const b=document.getElementById('sc-battle');b.classList.add('shake');
  setTimeout(()=>b.classList.remove('shake'),400);
}
function shockwave(){
  const sw=document.getElementById('shockwave');sw.classList.add('go');
  setTimeout(()=>sw.classList.remove('go'),800);
}
function chromaFlash(){
  const ch=document.getElementById('chroma');ch.classList.add('go');
  setTimeout(()=>ch.classList.remove('go'),600);
}

// ── WEB AUDIO API — SOUND DESIGN ──
const AC=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('pointerdown',()=>{if(AC.state==='suspended')AC.resume();},{once:true});
function playHit(){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(200,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.1);
  g.gain.setValueAtTime(0.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.01,AC.currentTime+0.12);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime);o.stop(AC.currentTime+0.12);
}
function playCrit(){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(350,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(150,AC.currentTime+0.15);
  g.gain.setValueAtTime(0.4,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.2);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime);o.stop(AC.currentTime+0.2);
}
function playMagic(el){
  const freqs={fire:320,ice:240,thunder:400,wind:280,all:300,restore:350,dark:180};
  const f=freqs[el]||250;
  const o=AC.createOscillator(),g=AC.createGain(),f2=AC.createBiquadFilter();
  o.type='square';o.frequency.setValueAtTime(f,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(f*1.8,AC.currentTime+0.08);
  o.frequency.exponentialRampToValueAtTime(f*0.5,AC.currentTime+0.16);
  f2.type='lowpass';f2.frequency.setValueAtTime(1200,AC.currentTime);
  g.gain.setValueAtTime(0.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.18);
  o.connect(f2);f2.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime);o.stop(AC.currentTime+0.18);
}
function playLimitSound(){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(500,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(800,AC.currentTime+0.1);
  o.frequency.exponentialRampToValueAtTime(200,AC.currentTime+0.25);
  g.gain.setValueAtTime(0.35,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.3);
  o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime);o.stop(AC.currentTime+0.3);
}

// ── ENEMY LOGIC ──
function applyED(d,cls){
  S.enemy.hp-=d;
  if(S.enemy.hp<=0){S.enemy.hp=0;S.over=true;onWin();}
  updateBars();
}
function dealToPlayer(d){
  if(S.player.wall)d=Math.floor(d*0.5);
  S.player.hp-=d;
  if(S.player.hp<=0){S.player.hp=0;S.over=true;onLose();}
  if(S.player.wall){
    S.player.wallT--;
    if(S.player.wallT<=0){S.player.wall=false;removeStatus('p-status','wall');}
  }
  return d;
}
function enemyAtkHit(mult,cls,verb){
  atkSlide('cw-e','cw-p');
  const crit=Math.random()<0.12;
  let d=calcD(S.enemy.atk,S.player.def,mult);if(crit)d=Math.floor(d*1.5);
  playHit();
  setTimeout(()=>{
    hitFl('cw-p');d=dealToPlayer(d);
    log(`${S.enemy.name} ${verb} for ${d}!`,cls);updateBars();chkEnd();
  },230);
}
function enemyTurn(){
  if(S.over)return;
  if(S.enemy.mp>=10&&Math.random()<0.3){
    S.enemy.mp-=10;playMagic('dark');
    enemyAtkHit(1.15,'ls','casts a dark bolt');
    return;
  }
  if(S.enemy.hp<S.enemy.maxHp*0.35&&Math.random()<0.35){
    const heal=Math.floor(S.enemy.maxHp*0.15);
    S.enemy.hp=Math.min(S.enemy.maxHp,S.enemy.hp+heal);
    log(`${S.enemy.name} regenerates ${heal} HP!`,'lh');
    updateBars();chkEnd();
    return;
  }
  enemyAtkHit(0.95,'ls','attacks');
}
function chLim(v){S.player.limit=Math.min(100,S.player.limit+v);updateBars()}
function chkEnd(){if(S.over){clearInterval(S.atbT)}}

// ── MATCH ──
function startBattle(){
  if(S.wave>WAVES.length)S.wave=1;
  const wave=WAVES[Math.min(S.wave-1,WAVES.length-1)];
  const eName=wave[Math.floor(Math.random()*wave.length)];
  const e=ENEMIES[eName];
  const scale=1+(S.wave-1)*0.05;
  const hp=Math.round(e.hp*scale),atk=Math.round(e.atk*scale);
  const w={...e,hp,atk,maxHp:hp};
  S.enemy=w;S.over=false;S.pTurn=false;S.pAtb=0;S.eAtb=0;S.streak=0;
  S.player.hp=100;S.player.mp=50;S.player.limit=0;
  S.pStatus={};S.eStatus={};
  buildEnemySprite(w.spr);
  document.getElementById('b-ename').textContent='⚔ '+w.name;
  document.getElementById('arena-ename').textContent=w.name;
  document.getElementById('arena-tint').style.background=ARENA_TINTS[w.spr]||'rgba(255,79,31,0.12)';
  document.getElementById('glow-p').style.background=
    `radial-gradient(ellipse at center,${GLOW_P_COLS[w.spr]||'var(--willow-glow)'} 0%,transparent 72%)`;
  buildSegBars();renderLoadout();updateWeakRow();updateBars();
  document.getElementById('blog').innerHTML='';
  
  // Initialize turn indicators
  document.getElementById('p-turn-ind').classList.remove('active');
  document.getElementById('e-turn-ind').classList.add('active');
  
  showSc('sc-battle');
  log('BATTLE START — '+w.name+' appears!','ls');
  if(WAVE_STORY[S.wave-1])log(WAVE_STORY[S.wave-1],'lm');
  if(S.combo)log(`✨ ${S.combo.icon} ${S.combo.name} armed!`,'lc');
  log('🧚 Noom Wolliw takes the field.','lo');
  if(S.wave===7)log('🗡️ "The willow forgets no one." — Ashveil','ls');
  clearInterval(S.atbT);S.atbT=setInterval(tick,75);
}

function buildEnemySprite(spr){

const SEGS={hp:20,mp:12,atb:10,lim:10};
function buildSegBars(){
  ['p-hp-t','p-mp-t','p-atb-t','p-lim-t','e-hp-t','e-atb-t'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;el.innerHTML='';
    const key=id.includes('hp')?'hp':id.includes('mp')?'mp':id.includes('atb')?'atb':'lim';
    const n=SEGS[key]||10;
    for(let i=0;i<n;i++){const s=document.createElement('div');s.className='bseg off';el.appendChild(s);}
  });
}
function updateBars(){
  const p=S.player,e=S.enemy;
  updSeg('p-hp-t',p.hp,p.maxHp,'hp');
  updSeg('p-mp-t',p.mp,p.maxMp,'mp');
  updSeg('p-atb-t',S.pAtb,100,'atb');
  updSeg('p-lim-t',p.limit,100,'lim');
  updSeg('e-hp-t',Math.max(0,e.hp),e.maxHp,'hp',true);
  updSeg('e-atb-t',S.eAtb,100,'atb',true);
  document.getElementById('p-hp-v').textContent=`${Math.max(0,p.hp)}/${p.maxHp}`;
  document.getElementById('p-mp-v').textContent=`${Math.max(0,p.mp)}/${p.maxMp}`;
  document.getElementById('p-atb-pct').textContent=Math.floor(S.pAtb)+'%';
  document.getElementById('p-lim-pct').textContent=Math.floor(p.limit)+'%';
  document.getElementById('e-hp-v').textContent=`${Math.max(0,e.hp)}/${e.maxHp}`;
  document.getElementById('e-atb-pct').textContent=Math.floor(S.eAtb)+'%';
  const pAtbT=document.getElementById('p-atb-t');pAtbT.className='btrack'+(S.pTurn?' atb-ready':'');
  const eAtbT=document.getElementById('e-atb-t');eAtbT.className='btrack'+(S.eAtb>=90?' atb-ready-e':'');
  // Turn indicators
  const pTI=document.getElementById('p-turn-ind');
  const eTI=document.getElementById('e-turn-ind');
  if(pTI && eTI){
    if(S.pTurn){pTI.classList.add('active');eTI.classList.remove('active');}
    else{pTI.classList.remove('active');eTI.classList.add('active');}
  }
}
function updSeg(id,val,max,type,enemy=false){
  const el=document.getElementById(id);if(!el)return;
  const segs=el.querySelectorAll('.bseg');if(!segs.length)return;
  const filled=Math.round((val/max)*segs.length);
  const pct=val/max;
  segs.forEach((s,i)=>{
    if(i<filled){
      if(type==='hp'){s.className='bseg on-hp'+(pct<0.26?' lo':pct<0.51?' mid':'');}
      else if(type==='mp'){s.className='bseg on-mp';}
      else if(type==='atb'){s.className=`bseg ${enemy?'on-atbe':'on-atb'}`;}
      else if(type==='lim'){s.className='bseg on-lim';}
    } else s.className='bseg off';
  });
}

function selectCard(card){
  if(!S.pTurn||S.over)return;

  S.pendingCard=card;S.dice=[1,1,1,1,1];S.held=[false,false,false,false,false];S.rollsLeft=3;S.rolled=false;
  drawDiceUI(card);

// ── YAHTZEE DICE — POWER ROLL ──
const PIP_LAYOUTS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function pipHTML(v){
  const cells=PIP_LAYOUTS[v]||[];
  let html='<div class="pip-grid">';
  for(let i=0;i<9;i++)html+=`<span class="pip${cells.includes(i)?' on':''}"></span>`;
  return html+'</div>';
}
function scoreDice(dice){
  const counts={};dice.forEach(v=>counts[v]=(counts[v]||0)+1);
  const vals=Object.values(counts).sort((a,b)=>b-a);
  const uniq=Object.keys(counts).map(Number);
  const has=seq=>seq.every(v=>uniq.includes(v));
  if(vals[0]===5)return{mult:2.5,label:'YAHTZEE!!'};
  if(vals[0]===4)return{mult:1.8,label:'FOUR OF A KIND'};
  if(vals[0]===3&&vals[1]===2)return{mult:1.5,label:'FULL HOUSE'};
  if(has([1,2,3,4,5])||has([2,3,4,5,6]))return{mult:1.4,label:'LARGE STRAIGHT'};
  if(has([1,2,3,4])||has([2,3,4,5])||has([3,4,5,6]))return{mult:1.25,label:'SMALL STRAIGHT'};
  if(vals[0]===3)return{mult:1.15,label:'THREE OF A KIND'};
  if(vals[0]===2&&vals[1]===2)return{mult:1.05,label:'TWO PAIR'};
  return{mult:0.85,label:'BUST'};
}
function drawDiceUI(card){
  const r=document.getElementById('arow');r.innerHTML='';
  const wrap=document.createElement('div');wrap.className='dice-panel';
  const info=document.createElement('div');info.className='dice-info';
  const sc=S.rolled?scoreDice(S.dice):{mult:1,label:'ROLL TO BEGIN'};
  const momentum=1+Math.min(S.streak,5)*0.03;
  const streakTag=S.streak>0?` <span style="color:var(--thunder)">🔥×${momentum.toFixed(2)}</span>`:'';
  info.innerHTML=`<span>${card.icon} ${card.name} — roll for power${streakTag}</span><span class="dice-score">${sc.label} ×${sc.mult.toFixed(2)}</span>`;
  wrap.appendChild(info);
  const row=document.createElement('div');row.className='dice-row';
  S.dice.forEach((v,i)=>{
    const d=document.createElement('div');d.className='die'+(S.held[i]?' held':'');
    d.innerHTML=S.rolled?pipHTML(v):'<span class="die-q">?</span>';
    if(S.rolled&&S.rollsLeft>0)d.onclick=()=>{S.held[i]=!S.held[i];drawDiceUI(card);};
    row.appendChild(d);
  });
  wrap.appendChild(row);
  const btns=document.createElement('div');btns.className='dice-btns';
  const rollBtn=document.createElement('button');rollBtn.className='act act-mag';
  rollBtn.textContent=S.rollsLeft>0?`🎲 ROLL (${S.rollsLeft} left)`:'NO ROLLS LEFT';
  rollBtn.disabled=S.rollsLeft<=0;rollBtn.onclick=()=>doRoll(card);
  const confirmBtn=document.createElement('button');confirmBtn.className='act act-atk';
  confirmBtn.textContent='✓ LOCK IN';confirmBtn.disabled=!S.rolled;
  confirmBtn.onclick=()=>{const s=scoreDice(S.dice);resolveCard(card,s.mult,s.label);};
  const backBtn=document.createElement('button');backBtn.className='act act-itm';
  backBtn.textContent='↩ CHOOSE ANOTHER';backBtn.onclick=renderHand;
  btns.appendChild(rollBtn);btns.appendChild(confirmBtn);btns.appendChild(backBtn);
  wrap.appendChild(btns);
  r.appendChild(wrap);
}
function doRoll(card){
  if(S.rollsLeft<=0)return;
  S.rollsLeft--;S.rolled=true;
  S.dice=S.dice.map((v,i)=>S.held[i]?v:1+Math.floor(Math.random()*6));
  playHit();
  drawDiceUI(card);
}

// ── CARD RESOLUTION ──
function resolveCard(card,mult,label){
  if(!S.pTurn||S.over)return;
  endTurn();
  if(card.mp>0)S.player.mp-=card.mp;
  let tag=label?` — ${label}`:'';
  if(label){
    const momentum=1+Math.min(S.streak,5)*0.03;
    if(momentum>1){mult*=momentum;tag+=` (streak ×${momentum.toFixed(2)})`;}
    if(label==='BUST')S.streak=0;else S.streak=Math.min(S.streak+1,5);
  }
  switch(card.kind){
    case 'atk':{
      atkSlide('cw-p','cw-e');
      const d=calcD(S.player.atk,S.enemy.def,mult,card.el);
      if(mult>=1.8){S.stats.crits++;playCrit();}else playHit();
      setTimeout(()=>{hitFl('cw-e');applyED(d);
        log(`${card.icon} ${card.name}${tag} hits for ${d}!`,mult>=1.8?'lk':'lp');
        chLim(mult>=1.8?18:12);S.stats.dealt+=d;chkEnd();},230);
      break;
    }
    case 'dmg':{
      S.stats.spells++;playMagic(card.el);
      let d=calcD(S.player.atk,S.enemy.def,(card.pow/30)*mult,card.el);
      if(card.el==='all')d=Math.floor(d*0.7);
      const weak=S.enemy.weak.includes(card.el),res=S.enemy.res.includes(card.el);
      popD(d,weak?'dw':res?'dr':'dp','cw-e');S.enemy.hp-=d;
      if(weak){screenShake();log(`${card.icon} ${card.name}${tag} — WEAKNESS! hits for ${d}!`,'lk');}
      else if(res)log(`${card.icon} ${card.name}${tag} — resisted... hits for ${d}.`,'lm');
      else log(`${card.icon} ${card.name}${tag} hits for ${d}!`,'lm');
      if(S.enemy.hp<=0){S.enemy.hp=0;S.over=true;onWin();}
      chLim(weak?12:8);S.stats.dealt+=d;updateBars();chkEnd();
      break;
    }
    case 'heal':{
      playMagic('restore');
      const a=Math.floor((card.pow+30)*mult);
      S.player.hp=Math.min(S.player.maxHp,S.player.hp+a);
      popD(a,'dh','cw-p');log(`${card.icon} ${card.name}${tag} restores ${a} HP!`,'lh');
      updateBars();chkEnd();
      break;
    }
    case 'drawtwo':{
      let total=0;
      const strike=()=>{const d=calcD(S.player.atk,S.enemy.def,0.7*mult);total+=d;popD(d,'dk','cw-e');S.enemy.hp-=d;playHit();};
      atkSlide('cw-p','cw-e');
      setTimeout(strike,120);
      setTimeout(()=>{strike();
        if(S.enemy.hp<=0){S.enemy.hp=0;S.over=true;onWin();}
        log(`✌️ Draw Two${tag} deals ${total}!`,'lk');
        chLim(20);S.stats.dealt+=total;updateBars();chkEnd();},320);
      break;
    }
    case 'combo':{
      playMagic('fire');playLimitSound();
      let total=0;
      const strike=()=>{const d=calcD(S.player.atk*1.2,S.enemy.def,(S.combo.mat.length/4)*mult);total+=d;popD(d,'dk','cw-e');S.enemy.hp-=d;playHit();};
      setTimeout(()=>{screenShake();strike();},100);
      setTimeout(()=>{atkSlide('cw-p','cw-e');strike();},250);
      setTimeout(()=>{strike();},400);
      setTimeout(()=>{if(S.enemy.hp<=0){S.enemy.hp=0;S.over=true;onWin();}
        log(`✨ ${S.combo.icon} ${S.combo.name}${tag} deals ${total}!`,'lk');
        chLim(30);S.stats.dealt+=total;updateBars();chkEnd();},500);
      break;
    }
    case 'buff':{
      S.player.wallT=4;
      if(!S.player.wall){S.player.wall=true;addStatus('p-status','wall','🛡️ Wall');}
      log(`${card.icon} Wall rises!`,'lh');
      updateBars();
      break;
    }
    case 'limit':{
      S.player.limit=0;
      screenShake();chromaFlash();playLimitSound();shockwave();
      setTimeout(()=>{
        let d=calcD(S.player.atk*2.5,S.enemy.def,1.5);
        popD(d,'dk','cw-e');S.enemy.hp-=d;
        log(`🌸 WILLOWBLOOM! ${d} damage!`,'lk');
        if(S.enemy.hp<=0){S.enemy.hp=0;S.over=true;onWin();}S.stats.dealt+=d;updateBars();chkEnd();
      },300);
      break;
    }
  }
}
function doPotion(){
  if(!S.pTurn||S.over||S.items.potion<1)return;endTurn();
  S.items.potion--;const a=150;S.player.hp=Math.min(S.player.maxHp,S.player.hp+a);
  popD(a,'dh','cw-p');log('🧪 Potion restores '+a+' HP!','lh');updateBars();chkEnd();
}
function doEther(){
  if(!S.pTurn||S.over||S.items.ether<1)return;endTurn();
  S.items.ether--;const a=40;S.player.mp=Math.min(S.player.maxMp,S.player.mp+a);

}

      <div><div class="ei-name">${e.name}</div><div class="ei-st">HP: <b>${e.hp}</b> ATK: <b>${e.atk}</b> DEF: <b>${e.def}</b></div>
      ${ENEMY_FLAVOR[id]?`<div class="ei-tip" style="margin:4px 0 0">${ENEMY_FLAVOR[id]}</div>`:''}
      ${e.weak.length?`<div class="ei-tags">${e.weak.map(w=>`<div class="ei-tag">Weak: ${w}</div>`).join('')}</div>`:''}
      </div>`;
    el.appendChild(ew);
  });

  const cg=document.createElement('div');cg.className='ei-wrap';cg.style.background='rgba(0,0,0,0.5)';
  cg.style.borderColor='var(--thunder)';
  cg.innerHTML=`<div class="ei-emj">✨</div><div><div class="ei-name" style="color:var(--thunder)">Combos</div>
    <div class="ei-st">Equip every orb a fusion needs to unlock its card in battle.</div>
    ${Object.keys(COMBOS).map(cid=>{const c=COMBOS[cid];const need=[...new Set(c.mat)];
      const unlocked=need.every(elId=>S.eq.includes(elId));
      return `<div class="ei-tip"${unlocked?' style="color:var(--thunder);border-left-color:var(--thunder)"':''}>${c.icon} ${c.name} (${need.map(elId=>MAT[elId].icon).join(' ')})${unlocked?' — READY':''}</div>`;}).join('')}
    </div>`;
  el.appendChild(cg);

  showSc('sc-prep');
}

// ── INIT ──
document.getElementById('btn-start').onclick=startBattle;
document.getElementById('t-press').onclick=revealWaveSelect;
document.getElementById('ded').onclick=toggleLore;
document.addEventListener('keydown',e=>{
  if(e.code==='Space')revealWaveSelect();
  if(!S.pTurn)return;
  const cards=document.querySelectorAll('.uno-card:not(.disabled)');
  if(cards.length&&e.key>='1'&&e.key<='9'){cards[parseInt(e.key)-1]?.click();return;}
  if(e.key>='1'&&e.key<='5'){
    const btns=document.querySelectorAll('.act:not(:disabled)');
    btns[parseInt(e.key)-1]?.click();
  }
});

st.textContent=`
@keyframes popFl{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.dp{color:#00e676!important}.dk{color:#ff9800!important}.dh{color:#00ff88!important}
`;
document.head.appendChild(st);
</script>
